<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabelas</title>

    <style>
      table,
      td {
        border: 1px solid #000;
        border-collapse: collapse;
      }
    </style>
  </head>
  <body>
    <!-- Estrutura da tabela-->
    <!--
    TABLE 
        TR - table row
        Th- table header
        TD - table data
    -->

    <table>
      <tr>
        <th>Produtos</th>
        <th>Preços</th>
      </tr>

      <tr>
        <td>Café</td>
        <td>R$ 19,99</td>
      </tr>

      <tr>
        <td>Arroz</td>
        <td>R$ 29,99</td>
      </tr>
    </table>
  </body>
</html>
