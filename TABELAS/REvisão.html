<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Revisão</title>
    <link rel="stylesheet" href="styles/styles.css" />
  </head>
  <body>
    <!-- Tag table-->
    <table>
      <caption>
        Tabela de produtos
      </caption>

      <!-- Cabeçalho da tabela-->
      <thead>
        <tr>
          <th>Produtos</th>
          <th>Preços</th>
        </tr>
      </thead>

      <!-- Corpo da Tabela-->
      <tbody>
        <tr>
          <td>Arroz</td>
          <td>R$ 29,99</td>
        </tr>
        <tr>
          <td>Feijão</td>
          <td>R$ 10,00</td>
        </tr>

        <tr>
          <td>Café</td>
          <td>R$ 26,99</td>
        </tr>
      </tbody>

      <!-- Rodapé-->
      <tfoot>
        <tr>
          <th>Total de produtos</th>
          <td>R$ 59,99</td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
