<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aula 02 - CSS</title>
  </head>
  <!-- Usando estilo dentro do html -->
  <style>
    body {
      /* Cor de fundo */
      background-color: cadetblue;
    }

    h1 {
      /* Color - Cor de Texto */
      text-align: center;
      background-color: beige;
      color: #fff;
      background-color: red;
    }
  </style>

  <body>
    <h1>Trabalando com CSS</h1>
    <h1>Segundo texto</h1>
    <h1>Terceiro texto</h1>

    <P style="color:#fff; background-color: #000"> 

      Lorem ipsum dolor sit amet consectetur, adipisicing elit. Quia deserunt
      nihil maxime assumenda quod quis, nisi animi sapiente molestias, nam
      repellendus aperiam dignissimos fugit vero laboriosam quam cumque nulla
      consequatur?
    </p>
  </body>
</html>
