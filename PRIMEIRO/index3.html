<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Listas</title>
  </head>
  <body>
    <h1>Listas no HTML</h1>
    <h2>Lista não ordenadas</h2>
    <!-- LIsta não ordenadas-->
    <ul>
      <li>CAll of duty</li>
      <li>god of war</li>
      <li>battelefield</li>
      <li>GTA San andreas</li>
      <li>Resident eviel</li>
    </ul>
    <h2>Listas ordenadas</h2>
    <!-- OL possui parâmetros - type - tipo - start - começe de algum numero - reversed-->
    <ol type="1" start="4" reversed>
      <li>a odisseia</li>
      <li>homem aranha</li>
      <li>jogos mortais</li>
      <li>o mentalista</li>
    </ol>
  </body>
</html>
